services:
  backend:
    build: ./backend-api
    ports:
      - "5000:5000"
    depends_on:
      - redis
      - mongo
    env_file:
      - ./backend-api/.env

  worker:
    build: ./worker
    depends_on:
      - redis

  redis:
    image: redis:7

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
